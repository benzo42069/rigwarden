behavior:
  why: For each target device and iOS/Android, which direct USB MIDI, USB serial, class-compliant interface, five-pin MIDI, BLE MIDI, and network-bridge paths are technically feasible and what feature constraints apply?
  given:
  - The starter kit and current external documentation are available.
  when:
  - The assigned researcher investigates only the bounded question.
  then:
  - The deliverable distinguishes verified facts, hypotheses, unknowns, and blockers.
  - Every external factual claim has a source reference and access date.
  - No production behavior is created.
non_goals:
- Implementing native code
- Promising unsupported iOS USB serial behavior
- Treating note-on MIDI tests as editor-grade SysEx proof
preconditions:
- Repository contains this starter kit.
- Research access required by the packet is available or the packet is marked BLOCKED_ENVIRONMENT.
research:
  question: For each target device and iOS/Android, which direct USB MIDI, USB serial, class-compliant interface, five-pin MIDI, BLE MIDI, and network-bridge paths are technically feasible and what feature constraints apply?
  source_priority:
  - Official Apple CoreMIDI/USB/BLE/lifecycle documentation
  - Official Android MIDI/USB host/BLE/lifecycle documentation
  - Official Fractal device connection documentation
  - Provenance-audited open-source transport observations
  deliverables:
  - Create device × OS × transport matrix with fact/hypothesis status.
  - Identify permissions, entitlements, adapters, exclusive-port behavior, and background constraints.
  - Separate transport availability from feature availability such as realtime tuner streaming.
  - Recommend native API boundaries and test devices/adapters.
  - Identify feasibility blockers and experiments required.
  review:
  - Independent reviewer checks source quality, license interpretation boundaries, contradictions, and actionable conclusions.
acceptance:
- Create device × OS × transport matrix with fact/hypothesis status.
- Identify permissions, entitlements, adapters, exclusive-port behavior, and background constraints.
- Separate transport availability from feature availability such as realtime tuner streaming.
- Recommend native API boundaries and test devices/adapters.
- Identify feasibility blockers and experiments required.
- Uncertainty and contradictory sources are explicit.
- The report names follow-up ADRs or implementation packets without editing production code.
- Independent review is recorded.
block_conditions:
- Required source cannot be accessed.
- A material legal conclusion would require counsel rather than engineering inference.
evidence_directory: .tdd/evidence/TOP-RSCH-004
