id: TOP-RSCH-008
kind: research
epic: TOP-000
title: Finalize the lawful capture, sanitization, and fixture-contribution plan
status: INTEGRATED
priority: high
requirement_ids:
- CAPTURE-001
- CAPTURE-002
- CAPTURE-003
- CAPTURE-004
- QA-002
depends_on: []
parallel_group: research-a
agent:
  preferred_role: topology_explorer
  reviewer_role: topology_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - README.md
  - AGENTS.md
  - docs/**
  - sources/RESEARCH_TARGETS.md
  - .codex/**
  - work-items/**
  write:
  - docs/research/capture-and-fixture-plan.md
  - .tdd/evidence/TOP-RSCH-008/**
  forbidden:
  - apps/**
  - crates/**
  - native/**
  - device-packs/**
  - Cargo.toml
  - Cargo.lock
  - pubspec.yaml
behavior:
  why: How will Topology acquire reproducible protocol fixtures and hardware evidence without distributing proprietary material or personal/device secrets?
  given:
  - The starter kit and current external documentation are available.
  when:
  - The assigned researcher investigates only the bounded question.
  then:
  - The deliverable distinguishes verified facts, hypotheses, unknowns, and blockers.
  - Every external factual claim has a source reference and access date.
  - No production behavior is created.
non_goals:
- Capturing unknown write operations
- Redistributing official application binaries
- Treating unknown-rights captures as usable
preconditions:
- Repository contains this starter kit.
- Research access required by the packet is available or the packet is marked BLOCKED_ENVIRONMENT.
research:
  question: How will Topology acquire reproducible protocol fixtures and hardware evidence without distributing proprietary material or personal/device secrets?
  source_priority:
  - Project provenance contract and schema
  - Official editor/device workflows
  - Provenance-audited capture guides from open-source projects
  - Applicable repository licensing and contribution practices
  deliverables:
  - Define capture session types and read-only-first procedures.
  - Define sanitization tokens and review.
  - Define contributor redistribution declaration.
  - Define raw-versus-sanitized storage policy.
  - Define expected-value derivation independent from codecs.
  - Define fixture directory/naming/versioning.
  - Identify hardware and adapter needs for AM4/FM3 first.
  review:
  - Independent reviewer checks source quality, license interpretation boundaries, contradictions, and actionable conclusions.
acceptance:
- Define capture session types and read-only-first procedures.
- Define sanitization tokens and review.
- Define contributor redistribution declaration.
- Define raw-versus-sanitized storage policy.
- Define expected-value derivation independent from codecs.
- Define fixture directory/naming/versioning.
- Identify hardware and adapter needs for AM4/FM3 first.
- Uncertainty and contradictory sources are explicit.
- The report names follow-up ADRs or implementation packets without editing production code.
- Independent review is recorded.
block_conditions:
- Required source cannot be accessed.
- A material legal conclusion would require counsel rather than engineering inference.
evidence_directory: .tdd/evidence/TOP-RSCH-008
