id: TOP-RSCH-005
kind: research
epic: TOP-000
title: Perform a preliminary collision and package-identity screen for Topology
status: INTEGRATED
priority: high
requirement_ids:
- PLAT-005
- PLAT-006
depends_on: []
parallel_group: research-a
agent:
  preferred_role: topology_explorer
  reviewer_role: topology_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - README.md
  - AGENTS.md
  - docs/**
  - sources/RESEARCH_TARGETS.md
  - .codex/**
  - work-items/**
  write:
  - docs/research/topology-name-screen.md
  - .tdd/evidence/TOP-RSCH-005/**
  forbidden:
  - apps/**
  - crates/**
  - native/**
  - device-packs/**
  - Cargo.toml
  - Cargo.lock
  - pubspec.yaml
behavior:
  why: Is Topology usable as the working/public name for an open modeler editor, and which package IDs, repository names, domains, and store titles avoid obvious collisions?
  given:
  - The starter kit and current external documentation are available.
  when:
  - The assigned researcher investigates only the bounded question.
  then:
  - The deliverable distinguishes verified facts, hypotheses, unknowns, and blockers.
  - Every external factual claim has a source reference and access date.
  - No production behavior is created.
non_goals:
- Purchasing domains
- Publishing app listings
- Claiming legal clearance
- Contacting rights holders
preconditions:
- Repository contains this starter kit.
- Research access required by the packet is available or the packet is marked BLOCKED_ENVIRONMENT.
research:
  question: Is Topology usable as the working/public name for an open modeler editor, and which package IDs, repository names, domains, and store titles avoid obvious collisions?
  source_priority:
  - Trademark databases
  - Apple App Store and Google Play
  - GitHub/GitLab
  - crates.io and pub.dev
  - Music/audio/modeler products
  - Domains and social handles
  deliverables:
  - List exact conflicting or adjacent uses.
  - Rate collision risk by category and jurisdictional relevance.
  - Recommend keep, modify, or replace.
  - Propose safe provisional repository/package IDs without publishing them.
  - State clearly that this is a preliminary screen, not legal clearance.
  review:
  - Independent reviewer checks source quality, license interpretation boundaries, contradictions, and actionable conclusions.
acceptance:
- List exact conflicting or adjacent uses.
- Rate collision risk by category and jurisdictional relevance.
- Recommend keep, modify, or replace.
- Propose safe provisional repository/package IDs without publishing them.
- State clearly that this is a preliminary screen, not legal clearance.
- Uncertainty and contradictory sources are explicit.
- The report names follow-up ADRs or implementation packets without editing production code.
- Independent review is recorded.
block_conditions:
- Required source cannot be accessed.
- A material legal conclusion would require counsel rather than engineering inference.
evidence_directory: .tdd/evidence/TOP-RSCH-005
