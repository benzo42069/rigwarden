id: TOP-RSCH-006
kind: research
epic: TOP-000
title: Define the blind-accessibility tooling and physical test plan
status: INTEGRATED
priority: high
requirement_ids:
- A11Y-001
- A11Y-011
- QA-007
depends_on: []
parallel_group: research-a
agent:
  preferred_role: topology_explorer
  reviewer_role: topology_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - README.md
  - AGENTS.md
  - docs/**
  - sources/RESEARCH_TARGETS.md
  - .codex/**
  - work-items/**
  write:
  - docs/research/accessibility-test-plan.md
  - .tdd/evidence/TOP-RSCH-006/**
  forbidden:
  - apps/**
  - crates/**
  - native/**
  - device-packs/**
  - Cargo.toml
  - Cargo.lock
  - pubspec.yaml
behavior:
  why: Which Flutter, iOS, Android, hardware, and community test methods can prove Topology’s blind-user workflows rather than only semantics snapshots?
  given:
  - The starter kit and current external documentation are available.
  when:
  - The assigned researcher investigates only the bounded question.
  then:
  - The deliverable distinguishes verified facts, hypotheses, unknowns, and blockers.
  - Every external factual claim has a source reference and access date.
  - No production behavior is created.
non_goals:
- Claiming blind accessibility from automated semantics only
- Implementing UI
- Collecting personal medical information
preconditions:
- Repository contains this starter kit.
- Research access required by the packet is available or the packet is marked BLOCKED_ENVIRONMENT.
research:
  question: Which Flutter, iOS, Android, hardware, and community test methods can prove Topology’s blind-user workflows rather than only semantics snapshots?
  source_priority:
  - Official Flutter accessibility/testing documentation
  - Official Apple VoiceOver/accessibility documentation
  - Official Android TalkBack/accessibility documentation
  - Established accessibility testing guidance
  - Project accessibility contract
  deliverables:
  - Map each beta accessibility task to unit, widget, simulator/emulator, physical screen-reader, and blind-user evidence.
  - Identify available automation and its limits.
  - Define test device matrix and focus/announcement logging method.
  - Define contributor recruitment/feedback requirements without collecting unnecessary personal data.
  - List release-blocking accessibility failures.
  review:
  - Independent reviewer checks source quality, license interpretation boundaries, contradictions, and actionable conclusions.
acceptance:
- Map each beta accessibility task to unit, widget, simulator/emulator, physical screen-reader, and blind-user evidence.
- Identify available automation and its limits.
- Define test device matrix and focus/announcement logging method.
- Define contributor recruitment/feedback requirements without collecting unnecessary personal data.
- List release-blocking accessibility failures.
- Uncertainty and contradictory sources are explicit.
- The report names follow-up ADRs or implementation packets without editing production code.
- Independent review is recorded.
block_conditions:
- Required source cannot be accessed.
- A material legal conclusion would require counsel rather than engineering inference.
evidence_directory: .tdd/evidence/TOP-RSCH-006
