id: TOP-AM4-REG-001
kind: implementation
epic: TOP-1200
title: Resolve the captured AM4 firmware to one exact read/write profile
status: BLOCKED_FIXTURE
priority: high
requirement_ids:
- DEV-004
- PACK-002
- PACK-006
depends_on:
- TOP-AM4-PROTO-002
- TOP-REG-002
parallel_group: am4-reg-a
agent:
  preferred_role: topology_implementer
  reviewer_role: topology_security_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - fixtures/am4/identity/**
  - crates/topology_device_registry/**
  - schemas/device-pack.schema.json
  - docs/research/**
  write:
  - device-packs/am4/**
  - crates/topology_device_registry/tests/am4_profile.rs
  - .tdd/evidence/TOP-AM4-REG-001/**
  forbidden:
  - Cargo.toml
  - Cargo.lock
  - apps/**
  - native/**
  - device-packs/index.*
behavior:
  why: The AM4 vertical slice needs a declarative exact firmware profile before writes can be enabled.
  given:
  - Captured AM4 identity reports exact firmware X.
  - A minimal pack declares only identity match, firmware X, transport, and identity/preset-read capability.
  when:
  - Registry loads and resolves the pack.
  then:
  - Exact identity resolves the pack.
  - Firmware X is writable only for capabilities backed by evidence.
  - Firmware X+unknown does not resolve writable.
  - Pack provenance references fixture/source IDs.
non_goals:
- Complete block catalog
- Pack signing
- Remote updates
- Other firmware versions
preconditions:
- TOP-AM4-PROTO-002 and TOP-REG-002 integrated.
- Device-pack schema validator exists or packet is amended to add a test-scoped loader safely.
test:
  layer: rust_integration
  file: crates/topology_device_registry/tests/am4_profile.rs
  name: exact_am4_firmware_profile_resolves_without_fallback
  red_command: cargo test -p topology-device-registry exact_am4_firmware_profile_resolves_without_fallback -- --exact --nocapture
  expected_red:
    acceptable:
    - Fixture pack missing.
    - Assertion fails because exact match not resolved or unknown firmware writable.
    unacceptable:
    - Pack schema/provenance invalid.
    - Device/firmware values guessed.
    - Index shared file edited by worker.
  green_command: cargo test -p topology-device-registry exact_am4_firmware_profile_resolves_without_fallback -- --exact --nocapture
minimum_green:
- Create one minimal declarative pack for exact captured firmware.
- Enable only evidenced capabilities.
- No broad catalog.
required_sweeps:
- cargo test -p topology-device-registry
- validate device-packs/am4 with integrated validator
- cargo fmt --all -- --check
acceptance:
- Exact resolution works.
- Unknown firmware read-only.
- Provenance complete.
- Reviewer/security reviewer approve.
available_claims_after_completion:
- UNIT_VERIFIED
- CAPTURE_VERIFIED
unavailable_claims:
- PACK_SIGNATURE_VERIFIED
- HARDWARE_VERIFIED
required_followups:
- TOP-AM4-SIM-001
- TOP-AM4-HIL-001
block_conditions: []
evidence_directory: .tdd/evidence/TOP-AM4-REG-001
