id: TOP-AM4-PROTO-001
kind: implementation
epic: TOP-1200
title: Encode the provenance-approved AM4 identity query exactly
status: BLOCKED_FIXTURE
priority: high
requirement_ids:
- DEV-003
- QA-002
depends_on:
- TOP-AM4-FIX-001
- TOP-PRESET-002
parallel_group: am4-proto-a
agent:
  preferred_role: topology_implementer
  reviewer_role: topology_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - fixtures/am4/identity/**
  - docs/research/open-source-source-and-license-audit.md
  - docs/research/fractal-primary-source-map.md
  - crates/topology_preset/**
  write:
  - crates/topology_protocol_am4/Cargo.toml
  - crates/topology_protocol_am4/src/lib.rs
  - crates/topology_protocol_am4/src/identity.rs
  - crates/topology_protocol_am4/tests/identity_query.rs
  - .tdd/evidence/TOP-AM4-PROTO-001/**
  forbidden:
  - Cargo.toml
  - Cargo.lock
  - apps/**
  - native/**
  - device-packs/**
behavior:
  why: The first AM4 outbound message must match independent evidence byte-for-byte.
  given:
  - Approved fixture sidecar identifies the exact host-to-device identity query bytes.
  when:
  - The AM4 encoder builds an identity query.
  then:
  - Output equals the independently captured/published bytes exactly.
  - Unsupported options are not accepted.
  - No transport behavior is included.
non_goals:
- Identity response decoding
- Discovery sequencing
- Other opcodes
- Genericizing other devices
preconditions:
- TOP-AM4-FIX-001 integrated and approved.
- Protocol source/license decision recorded.
test:
  layer: byte_exact_protocol
  file: crates/topology_protocol_am4/tests/identity_query.rs
  name: encodes_approved_am4_identity_query_exactly
  red_command: cargo test -p topology-protocol-am4 encodes_approved_am4_identity_query_exactly -- --exact --nocapture
  expected_red:
    acceptable:
    - Missing encoder API.
    - Byte assertion fails.
    unacceptable:
    - Fixture missing/checksum invalid.
    - Expected bytes generated by encoder itself.
    - Workspace membership missing.
    - License/provenance unresolved.
  green_command: cargo test -p topology-protocol-am4 encodes_approved_am4_identity_query_exactly -- --exact --nocapture
minimum_green:
- Implement only identity query encoder.
- Use bounded fixed output.
- Reference fixture ID in test.
- No speculative reusable opcode framework beyond needed helpers.
required_sweeps:
- cargo test -p topology-protocol-am4
- cargo fmt --all -- --check
- cargo clippy -p topology-protocol-am4 --all-targets -- -D warnings
acceptance:
- Exact bytes match independent fixture.
- Fixture checksum/provenance verified.
- Reviewer approves circularity check.
available_claims_after_completion:
- BYTE_FIXTURE_VERIFIED
unavailable_claims:
- SIMULATOR_VERIFIED
- HARDWARE_VERIFIED
required_followups:
- TOP-AM4-SIM-001
- TOP-AM4-HIL-001
block_conditions: []
evidence_directory: .tdd/evidence/TOP-AM4-PROTO-001
