behavior:
  why: A blind user must understand a route without interpreting cable position.
  given:
  - Graph represents Input 1 → Drive 1 → Output 1 and is exposed through the typed bridge or an approved test boundary.
  when:
  - Accessible route list is built.
  then:
  - Semantic traversal is Input 1, Drive 1, Output 1.
  - Each node announces incoming/outgoing context.
  - Each connection is individually navigable and exposes a remove action.
  - No understanding depends on color or spatial cable position.
non_goals:
- Split/merge language
- Actual removal mutation
- VoiceOver/TalkBack physical verification
- Visual canvas
preconditions:
- TOP-GRAPH-002, TOP-GRAPH-005, and TOP-UI-001 integrated.
- TOP-FFI-002 provides the Rust-authored synthetic serial snapshot through the real generated bridge.
- This packet remains fixture-only: no live graph or device compatibility claim.
test:
  layer: flutter_semantics
  file: apps/mobile_flutter/test/features/routing/accessible_route_list_test.dart
  name: serial_route_is_completely_navigable_without_canvas
  red_command: cd apps/mobile_flutter && flutter test test/features/routing/accessible_route_list_test.dart --plain-name "serial route is completely navigable without canvas"
  expected_red:
    acceptable:
    - Missing accessible route view.
    - Semantic assertion fails because order/context/action is absent.
    unacceptable:
    - Test uses a hand-built Dart graph that duplicates Rust traversal without approved boundary.
    - Flutter SDK failure.
    - Pure visual golden failure.
  green_command: cd apps/mobile_flutter && flutter test test/features/routing/accessible_route_list_test.dart --plain-name "serial route is completely navigable without canvas"
minimum_green:
- Add smallest list-based semantic view.
- Use stable traversal output rather than reimplement graph logic in Dart.
- Expose remove action callback without implementing hardware mutation.
required_sweeps:
- cd apps/mobile_flutter && flutter test test/features/routing/accessible_route_list_test.dart
- cd apps/mobile_flutter && flutter test test/features/routing/
- cd apps/mobile_flutter && flutter analyze
acceptance:
- Semantic order complete.
- Context/actions present.
- No color/position dependency.
- Accessibility reviewer approves.
available_claims_after_completion:
