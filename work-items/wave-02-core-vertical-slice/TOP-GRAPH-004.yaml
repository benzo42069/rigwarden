id: TOP-GRAPH-004
kind: implementation
epic: TOP-300
title: Reject a prohibited routing cycle
status: INTEGRATED
priority: high
requirement_ids:
- GRAPH-006
depends_on:
- TOP-GRAPH-002
- TOP-GRAPH-003
parallel_group: core-graph-c
agent:
  preferred_role: topology_implementer
  reviewer_role: topology_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - crates/topology_routing/**
  write:
  - crates/topology_routing/src/graph.rs
  - crates/topology_routing/src/validation.rs
  - crates/topology_routing/tests/cycle.rs
  - .tdd/evidence/TOP-GRAPH-004/**
  forbidden:
  - Cargo.toml
  - Cargo.lock
  - apps/**
  - native/**
  - device-packs/**
  - work-items/index.yaml
  - docs/requirements/traceability.yaml
behavior:
  why: Acyclic device profiles must not receive a graph write that creates feedback.
  given:
  - Graph contains A ��� B ��� C and the test profile disallows cycles.
  when:
  - Connection C ��� A is attempted.
  then:
  - Insertion is rejected with a cycle error.
  - Existing graph remains unchanged.
  - The error includes the affected node IDs or a deterministic cycle path.
non_goals:
- Devices that intentionally permit feedback
- Visual highlighting
- Topological traversal implementation beyond what validation needs
preconditions:
- TOP-GRAPH-002 and TOP-GRAPH-003 integrated.
test:
  layer: rust_unit
  file: crates/topology_routing/tests/cycle.rs
  name: prohibited_cycle_is_rejected_without_mutating_graph
  red_command: cargo test -p topology-routing prohibited_cycle_is_rejected_without_mutating_graph -- --exact --nocapture
  expected_red:
    acceptable:
    - Assertion fails because cycle is accepted.
    - Missing cycle validator API.
    unacceptable:
    - A/B/C fixture lacks valid ports.
    - Connection fails earlier for missing endpoint.
    - Unrelated failure.
  green_command: cargo test -p topology-routing prohibited_cycle_is_rejected_without_mutating_graph -- --exact --nocapture
minimum_green:
- Detect cycles for the tested graph.
- Validate before commit.
- Keep policy explicit rather than global hidden assumption.
required_sweeps:
- cargo test -p topology-routing
- cargo fmt --all -- --check
- cargo clippy -p topology-routing --all-targets -- -D warnings
acceptance:
- Cycle rejected.
- Acyclic insertion remains accepted.
- Graph unchanged on rejection.
- Reviewer approves.
available_claims_after_completion:
- UNIT_VERIFIED
unavailable_claims:
- DEVICE_SPECIFIC_ROUTING_VERIFIED
- HARDWARE_VERIFIED
required_followups:
- TOP-GRAPH-005
block_conditions: []
evidence_directory: .tdd/evidence/TOP-GRAPH-004
