id: TOP-UI-001
kind: implementation
epic: TOP-800
title: Adapt the session shell between narrow phone and wide tablet layouts
status: BLOCKED_DEPENDENCY
priority: high
requirement_ids:
- UI-003
- UI-004
depends_on:
- TOP-BOOT-003
- TOP-FFI-001
parallel_group: core-ui-a
agent:
  preferred_role: topology_implementer
  reviewer_role: topology_accessibility_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - apps/mobile_flutter/**
  - docs/THEME_AND_ASSET_SYSTEM.md
  - docs/ACCESSIBILITY.md
  write:
  - apps/mobile_flutter/lib/app/topology_app.dart
  - apps/mobile_flutter/lib/features/session/session_shell.dart
  - apps/mobile_flutter/test/features/session/session_shell_layout_test.dart
  - .tdd/evidence/TOP-UI-001/**
  forbidden:
  - Cargo.toml
  - Cargo.lock
  - apps/mobile_flutter/pubspec.yaml
  - apps/mobile_flutter/assets/**
  - native/**
  - device-packs/**
behavior:
  why: The complete editor must fit phones and tablets through adaptive structure, not scaled desktop UI.
  given:
  - The shell receives the same synthetic session model at a narrow phone width and wide tablet width.
  when:
  - Widgets are laid out.
  then:
  - Phone uses a single primary content region with explicit navigation.
  - Tablet exposes persistent navigation plus content.
  - Both retain the same reachable feature destinations.
  - No final decorative assets are fabricated.
non_goals:
- Complete navigation destinations
- Themes beyond structural tokens
- Device connection
- Landscape matrix beyond adjacent tests
preconditions:
- TOP-BOOT-003 and TOP-FFI-001 integrated.
test:
  layer: flutter_widget
  file: apps/mobile_flutter/test/features/session/session_shell_layout_test.dart
  name: session_shell_adapts_without_hiding_editor_destinations
  red_command: cd apps/mobile_flutter && flutter test test/features/session/session_shell_layout_test.dart --plain-name "session shell adapts without hiding editor destinations"
  expected_red:
    acceptable:
    - Missing session shell.
    - Assertion fails because destination absent or layout does not adapt.
    unacceptable:
    - Test relies on pixel-perfect golden only.
    - Asset missing unrelated to structure.
    - Flutter environment broken.
  green_command: cd apps/mobile_flutter && flutter test test/features/session/session_shell_layout_test.dart --plain-name "session shell adapts without hiding editor destinations"
minimum_green:
- Add minimal structural shell and semantic destination labels.
- Use SDK widgets/tokens only; no fake production art.
- Do not implement destination screens.
required_sweeps:
- cd apps/mobile_flutter && flutter test test/features/session/session_shell_layout_test.dart
- cd apps/mobile_flutter && flutter test
- cd apps/mobile_flutter && flutter analyze
- cd apps/mobile_flutter && dart format --output=none --set-exit-if-changed .
acceptance:
- Phone/tablet structures differ intentionally.
- All declared destinations reachable.
- Semantics labels present.
- Accessibility reviewer approves.
available_claims_after_completion:
- SEMANTICS_VERIFIED
unavailable_claims:
- VISUAL_ASSET_COMPLETE
- PLATFORM_DEVICE_VERIFIED
- HARDWARE_VERIFIED
required_followups:
- TOP-A11Y-001
- TOP-E2E-001
block_conditions: []
evidence_directory: .tdd/evidence/TOP-UI-001
