title: Round-trip one Rust-authored serial route snapshot across the generated Flutter bridge
status: INTEGRATED
priority: high
requirement_ids:
- GRAPH-008
- GRAPH-010
- A11Y-002
depends_on:
- TOP-GRAPH-002
- TOP-GRAPH-005
- TOP-FFI-001
parallel_group: core-bridge-route-a
agent:
  preferred_role: topology_implementer
  reviewer_role: topology_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - crates/topology_routing/**
  - crates/topology_bridge/**
  - apps/mobile_flutter/flutter_rust_bridge.yaml
  - apps/mobile_flutter/lib/core/bridge/**
  write:
  - crates/topology_bridge/Cargo.toml
  - Cargo.lock
  - crates/topology_bridge/src/api/mod.rs
  - crates/topology_bridge/src/api/serial_route.rs
  - crates/topology_bridge/src/frb_generated.rs
  - crates/topology_bridge/tests/serial_route.rs
  - apps/mobile_flutter/lib/core/bridge/generated/api.dart
  - apps/mobile_flutter/lib/core/bridge/generated/frb_generated.dart
  - apps/mobile_flutter/lib/core/bridge/generated/frb_generated.io.dart
