  file: crates/topology_command_engine/tests/parameter_mutation.rs
  name: valid_parameter_mutation_is_typed_but_not_encoded
  red_command: cargo test -p topology-command-engine valid_parameter_mutation_is_typed_but_not_encoded -- --exact --nocapture
  expected_red:
    acceptable:
    - Missing mutation validator API.
    - Assertion fails because valid value rejected or bytes emitted.
    unacceptable:
    - Profile fixture lacks declared metadata due unrelated setup.
    - Workspace membership missing.
  green_command: cargo test -p topology-command-engine valid_parameter_mutation_is_typed_but_not_encoded -- --exact --nocapture
minimum_green:
- Add minimal parameter metadata/range and mutation validator.
- Keep semantic mutation separate from wire command.
- Add only numeric type needed.
required_sweeps:
- cargo test -p topology-command-engine
