id: TOP-GRAPH-003
kind: implementation
epic: TOP-300
title: Reject a connection whose source node or port does not exist
status: BLOCKED_DEPENDENCY
priority: high
requirement_ids:
- GRAPH-005
- GRAPH-009
depends_on:
- TOP-GRAPH-002
parallel_group: core-graph-b
agent:
  preferred_role: topology_implementer
  reviewer_role: topology_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - crates/topology_routing/**
  write:
  - crates/topology_routing/src/graph.rs
  - crates/topology_routing/tests/missing_endpoint.rs
  - .tdd/evidence/TOP-GRAPH-003/**
  forbidden:
  - Cargo.toml
  - Cargo.lock
  - apps/**
  - native/**
  - device-packs/**
  - work-items/index.yaml
  - docs/requirements/traceability.yaml
behavior:
  why: Invalid endpoint references must fail locally before any device write is planned.
  given:
  - Graph contains one destination but the requested source node/port is absent.
  when:
  - Connection insertion is attempted.
  then:
  - Insertion returns a structured missing-source error with node/port identity.
  - Graph remains unchanged.
non_goals:
- Missing destination variant beyond an adjacent test
- UI error text
- Protocol encoding
preconditions:
- TOP-GRAPH-002 integrated.
test:
  layer: rust_unit
  file: crates/topology_routing/tests/missing_endpoint.rs
  name: missing_source_connection_is_rejected_without_mutation
  red_command: cargo test -p topology-routing missing_source_connection_is_rejected_without_mutation -- --exact --nocapture
  expected_red:
    acceptable:
    - Assertion fails because invalid connection is accepted or graph mutates.
    - Missing structured error variant.
    unacceptable:
    - Fixture omitted destination.
    - Unrelated test failure.
  green_command: cargo test -p topology-routing missing_source_connection_is_rejected_without_mutation -- --exact --nocapture
minimum_green:
- Validate before mutation.
- Return structured endpoint error.
- Add adjacent destination case only if minimal and tightly coupled.
required_sweeps:
- cargo test -p topology-routing
- cargo fmt --all -- --check
- cargo clippy -p topology-routing --all-targets -- -D warnings
acceptance:
- Invalid insertion leaves graph unchanged.
- Error identifies endpoint.
- Reviewer approves.
available_claims_after_completion:
- UNIT_VERIFIED
unavailable_claims:
- SIMULATOR_VERIFIED
- HARDWARE_VERIFIED
required_followups:
- TOP-GRAPH-004
block_conditions: []
evidence_directory: .tdd/evidence/TOP-GRAPH-003
