id: TOP-PRESET-002
kind: implementation
epic: TOP-200
title: Round-trip the initial Topology offline container without losing opaque bytes
status: BLOCKED_DEPENDENCY
priority: high
requirement_ids:
- PRESET-007
- PRESET-011
- LIB-010
depends_on:
- TOP-PRESET-001
parallel_group: core-preset-a
agent:
  preferred_role: topology_implementer
  reviewer_role: topology_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - crates/topology_preset/**
  write:
  - crates/topology_preset/src/container.rs
  - crates/topology_preset/src/lib.rs
  - crates/topology_preset/tests/container_roundtrip.rs
  - .tdd/evidence/TOP-PRESET-002/**
  forbidden:
  - Cargo.toml
  - Cargo.lock
  - apps/**
  - native/**
  - device-packs/**
  - work-items/index.yaml
  - docs/requirements/traceability.yaml
behavior:
  why: Offline editing needs a documented container that preserves normalized and unknown data.
  given:
  - A synthetic document contains device metadata, one graph edge, one known value, and one opaque segment.
  when:
  - It is serialized to the initial container and parsed back.
  then:
  - The parsed semantic document equals the original.
  - Opaque bytes are exact.
  - Schema version is explicit.
  - Malformed/truncated container returns an error, not panic.
non_goals:
- Vendor SysEx encoding
- Database storage
- Compression/encryption
- Long-term final format guarantee
preconditions:
- TOP-PRESET-001 integrated.
- Any serialization dependency is approved by integration owner and lockfile updated serially.
test:
  layer: file_codec
  file: crates/topology_preset/tests/container_roundtrip.rs
  name: offline_container_preserves_normalized_and_opaque_data
  red_command: cargo test -p topology-preset offline_container_preserves_normalized_and_opaque_data -- --exact --nocapture
  expected_red:
    acceptable:
    - Missing container encoder/decoder.
    - Assertion fails due lost opaque/known data.
    unacceptable:
    - Dependency not integrated.
    - Expected bytes generated only by production without semantic assertions.
    - Unrelated graph failure.
  green_command: cargo test -p topology-preset offline_container_preserves_normalized_and_opaque_data -- --exact --nocapture
minimum_green:
- Add versioned internal container for synthetic Topology data.
- Use bounded lengths.
- Return structured parse errors.
- Document that vendor compatibility is not established.
required_sweeps:
- cargo test -p topology-preset
- cargo fmt --all -- --check
- cargo clippy -p topology-preset --all-targets -- -D warnings
acceptance:
- Round-trip exact for declared fields.
- Truncation test passes.
- Schema version explicit.
- Reviewer approves.
available_claims_after_completion:
- UNIT_VERIFIED
- FILE_CODEC_VERIFIED
unavailable_claims:
- BYTE_FIXTURE_VERIFIED
- HARDWARE_VERIFIED
required_followups:
- TOP-UNDO-002
block_conditions: []
evidence_directory: .tdd/evidence/TOP-PRESET-002
