id: TOP-CMD-002
kind: implementation
epic: TOP-400
title: Reject every write mutation in an unknown-firmware read-only session
status: BLOCKED_DEPENDENCY
priority: high
requirement_ids:
- DEV-005
- SEC-001
- PACK-006
depends_on:
- TOP-REG-002
- TOP-CMD-001
parallel_group: core-command-a
agent:
  preferred_role: topology_implementer
  reviewer_role: topology_security_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - crates/topology_command_engine/**
  - crates/topology_device_registry/**
  write:
  - crates/topology_command_engine/src/mutation.rs
  - crates/topology_command_engine/tests/read_only.rs
  - .tdd/evidence/TOP-CMD-002/**
  forbidden:
  - Cargo.toml
  - Cargo.lock
  - apps/**
  - native/**
  - device-packs/**
  - work-items/index.yaml
  - docs/requirements/traceability.yaml
behavior:
  why: Read-only firmware status must be enforced in the command core, not only by disabled UI controls.
  given:
  - Session resolved as known device/unknown firmware read-only.
  - A syntactically valid parameter mutation is requested.
  when:
  - Validation/planning runs.
  then:
  - Mutation is rejected before encoding or queueing.
  - Error identifies read-only/unknown firmware.
  - No command object is created.
non_goals:
- UI disabling
- Offline document edits that do not target hardware
- Compatible ranges
preconditions:
- TOP-REG-002 and TOP-CMD-001 integrated.
test:
  layer: rust_unit
  file: crates/topology_command_engine/tests/read_only.rs
  name: read_only_session_cannot_plan_a_write
  red_command: cargo test -p topology-command-engine read_only_session_cannot_plan_a_write -- --exact --nocapture
  expected_red:
    acceptable:
    - Assertion fails because write plan is returned.
    - Missing read-only guard/error.
    unacceptable:
    - Test mutation invalid for another reason.
    - Profile accidentally exact-match writable.
  green_command: cargo test -p topology-command-engine read_only_session_cannot_plan_a_write -- --exact --nocapture
minimum_green:
- Check session capability before parameter mapping/encoding.
- Return structured reason.
- Preserve offline editing possibility outside hardware plan.
required_sweeps:
- cargo test -p topology-command-engine
- cargo test -p topology-device-registry
- cargo fmt --all -- --check
- cargo clippy -p topology-command-engine --all-targets -- -D warnings
acceptance:
- No write plan in read-only.
- Exact writable session still works.
- Reviewer/security reviewer approve.
available_claims_after_completion:
- UNIT_VERIFIED
- READ_ONLY
unavailable_claims:
- BYTE_FIXTURE_VERIFIED
- HARDWARE_VERIFIED
required_followups: []
block_conditions: []
evidence_directory: .tdd/evidence/TOP-CMD-002
