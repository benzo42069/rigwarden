behavior:
  why: The UI needs generated typed data without duplicating domain validation in Dart.
  given:
  - Rust DeviceIdentity has test family/model/firmware/endpoint values.
  when:
  - Dart requests the fixture identity through the generated bridge.
  then:
  - Dart receives typed fields exactly.
  - Invalid identity cannot be constructed through Dart bypass.
  - No raw protocol bytes or pointers leak into the presentation API.
non_goals:
- Native MIDI
- Full app state
- Performance benchmarks
- Production codegen selection beyond the approved ADR
preconditions:
- TOP-DOM-003, TOP-BOOT-003, and TOP-FFI-000 integrated.
- ADR-0004 selects the bridge dependency and the parent-owned generated configuration is green.
test:
  layer: ffi_integration
  file: apps/mobile_flutter/test/core/bridge/device_identity_test.dart
  name: typed_device_identity_round_trips_from_rust
  red_command: cd apps/mobile_flutter && flutter test test/core/bridge/device_identity_test.dart --plain-name "typed device identity round trips from Rust"
  expected_red:
    acceptable:
    - Missing generated bridge/API.
    - Assertion fails due lost/mistyped field.
    unacceptable:
    - Bridge dependency/codegen not integrated.
    - Test substitutes a pure Dart fake and never crosses FFI.
    - Native build environment unavailable.
  green_command: cd apps/mobile_flutter && flutter test test/core/bridge/device_identity_test.dart --plain-name "typed device identity round trips from Rust"
minimum_green:
- Expose one typed read-only bridge function.
- Use generated bindings.
- Keep validation in Rust.
- No async stream yet.
required_sweeps:
- cargo test -p topology-bridge
- cd apps/mobile_flutter && flutter test test/core/bridge/device_identity_test.dart
- cd apps/mobile_flutter && flutter analyze
- cargo fmt --all -- --check
acceptance:
- Test crosses actual generated bridge in supported harness.
- Fields exact.
- No duplicate Dart validation source of truth.
- Reviewer approves.
