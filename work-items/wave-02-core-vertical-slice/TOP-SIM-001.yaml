id: TOP-SIM-001
kind: implementation
epic: TOP-700
title: Complete one scripted request-response exchange with deterministic correlation
status: BLOCKED_DEPENDENCY
priority: high
requirement_ids:
- SIM-001
- TRANSPORT-003
depends_on:
- TOP-CMD-003
parallel_group: core-sim-a
agent:
  preferred_role: topology_implementer
  reviewer_role: topology_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - crates/topology_command_engine/**
  - docs/ARCHITECTURE.md
  write:
  - crates/topology_simulator/Cargo.toml
  - crates/topology_simulator/src/lib.rs
  - crates/topology_simulator/src/scripted_transport.rs
  - crates/topology_simulator/tests/request_response.rs
  - .tdd/evidence/TOP-SIM-001/**
  forbidden:
  - Cargo.toml
  - Cargo.lock
  - apps/**
  - native/**
  - device-packs/**
behavior:
  why: The command engine needs a deterministic peer before real protocol and hardware are available.
  given:
  - A scripted simulator expects request ID 7 with synthetic payload `read-state` and returns `state-ok`.
  when:
  - The request is sent through the simulator.
  then:
  - The matching response completes request 7.
  - Transcript records send/receive order.
  - Unexpected request returns a structured script mismatch.
  - Simulator identity is explicit.
non_goals:
- Vendor protocol bytes
- Timing/retry
- Physical transport
- Multiple endpoints
preconditions:
- TOP-CMD-003 integrated.
test:
  layer: simulator_integration
  file: crates/topology_simulator/tests/request_response.rs
  name: scripted_exchange_correlates_expected_response
  red_command: cargo test -p topology-simulator scripted_exchange_correlates_expected_response -- --exact --nocapture
  expected_red:
    acceptable:
    - Missing simulator API.
    - Assertion fails because response cannot correlate or mismatch is ignored.
    unacceptable:
    - Workspace membership missing.
    - Test uses real clock/network.
    - Unrelated command validation.
  green_command: cargo test -p topology-simulator scripted_exchange_correlates_expected_response -- --exact --nocapture
minimum_green:
- Add in-memory scripted transport and transcript.
- No sleeps/network.
- Use synthetic payload explicitly labeled non-vendor.
required_sweeps:
- cargo test -p topology-simulator
- cargo test -p topology-command-engine
- cargo fmt --all -- --check
- cargo clippy -p topology-simulator --all-targets -- -D warnings
acceptance:
- Expected exchange completes.
- Unexpected exchange fails clearly.
- Simulator cannot be mistaken for hardware.
- Reviewer approves.
available_claims_after_completion:
- SIMULATOR_VERIFIED
unavailable_claims:
- BYTE_FIXTURE_VERIFIED
- PLATFORM_DEVICE_VERIFIED
- HARDWARE_VERIFIED
required_followups:
- TOP-SIM-002
- TOP-E2E-001
block_conditions: []
evidence_directory: .tdd/evidence/TOP-SIM-001
