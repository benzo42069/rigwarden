behavior:
  why: FM3 direct control may arrive in arbitrary serial chunks; discovery must tolerate evidenced fragmentation without accepting malformed frames.
  given:
  - Approved identity response is split across multiple evidenced/synthetic transport chunks.
  - Exact minimal profile exists for captured firmware or test profile.
  when:
  - Discovery flow processes chunks.
  then:
  - One complete response is decoded only after full frame.
  - No partial chunk confirms identity.
  - Exact profile selected or intentionally read-only according to pack state.
  - Transcript records chunk boundaries.
non_goals:
- Physical USB
- Android API
- Preset read
preconditions:
- TOP-FM3-PROTO-001 and generic simulator integrated.
- Exact minimal FM3 pack exists through a reviewed packet or test-only profile.
test:
  layer: simulator_integration
  file: crates/topology_simulator/tests/fm3_discovery.rs
  name: fm3_discovery_tolerates_fragmented_serial_response
  red_command: cargo test -p topology-simulator fm3_discovery_tolerates_fragmented_serial_response -- --exact --nocapture
  expected_red:
    acceptable:
    - Missing fragmented replay path.
    - Assertion decodes too early/fails to reassemble.
    unacceptable:
    - Test feeds full response at once.
    - Fixture invalid.
    - Transport chunk handling placed inside semantic decoder incorrectly.
  green_command: cargo test -p topology-simulator fm3_discovery_tolerates_fragmented_serial_response -- --exact --nocapture
minimum_green:
- Add bounded reassembly at transport/session boundary.
- Use proven decoder.
- No native code.
required_sweeps:
- cargo test -p topology-protocol-fm3
- cargo test -p topology-simulator
- cargo fmt --all -- --check
acceptance:
- No partial confirmation.
- Full response exact.
- Malformed/oversize adjacent case rejected.
- Reviewer/security reviewer approve.
