behavior:
  why: iOS must expose only transport paths supported by current platform/device evidence and clearly require an interface/adapter when direct access is unavailable.
  given:
  - CoreMIDI fake contains one compatible interface endpoint and unrelated endpoints.
  when:
  - Enumerator runs.
  then:
  - Compatible endpoint is listed with connection-path explanation.
  - Unrelated endpoint is not auto-selected.
  - No claim of direct serial is made unless research proved it.
  - Manual selection remains possible.
non_goals:
- Physical interface
- Sending bytes
- BLE pairing
- Android
preconditions:
- TOP-FM3-RSCH-001 integrated with selected iOS path.
- Xcode test harness available.
test:
  layer: native_unit
  file: apps/mobile_flutter/ios/RunnerTests/Fm3MidiEndpointEnumeratorTests.swift
  name: enumerates_only_evidenced_fm3_compatible_midi_path
  red_command: cd apps/mobile_flutter/ios && xcodebuild test -scheme Runner -destination 'platform=iOS Simulator,name=iPhone 16' -only-testing:RunnerTests/Fm3MidiEndpointEnumeratorTests/testEnumeratesOnlyEvidencedFm3CompatibleMidiPath
  expected_red:
    acceptable:
    - Missing enumerator API.
    - Assertion auto-selects unrelated endpoint or mislabels direct path.
    unacceptable:
    - Xcode/simulator unavailable.
    - Research unresolved.
    - Test uses real endpoint nondeterministically.
  green_command: cd apps/mobile_flutter/ios && xcodebuild test -scheme Runner -destination 'platform=iOS Simulator,name=iPhone 16' -only-testing:RunnerTests/Fm3MidiEndpointEnumeratorTests/testEnumeratesOnlyEvidencedFm3CompatibleMidiPath
minimum_green:
- Add narrow CoreMIDI enumeration adapter.
- Preserve manual fallback.
- No send/open beyond enumeration.
required_sweeps:
- Run iOS unit tests.
- cd apps/mobile_flutter && flutter analyze
- cd apps/mobile_flutter && flutter test
acceptance:
- Evidenced endpoint path truthful.
- No unsupported direct-serial claim.
- Reviewer approves.
available_claims_after_completion:
