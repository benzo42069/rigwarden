behavior:
  why: FM3 discovery needs byte-exact decoding independent from the native serial framing path.
  given:
  - Approved response fixture with independent expected model/firmware.
  when:
  - Decoder receives reconstructed protocol bytes.
  then:
  - Typed identity exact.
  - Transport chunk boundaries do not alter protocol result.
  - Truncated/checksum-invalid input rejected.
  - Unknown bytes handled explicitly.
non_goals:
- Native USB
- Preset decode
- Other devices
- Identity query encoder if not independently proven
preconditions:
- TOP-FM3-FIX-001 and TOP-DOM-003 integrated.
test:
  layer: byte_exact_protocol
  file: crates/topology_protocol_fm3/tests/identity.rs
  name: decodes_approved_fm3_identity_response
  red_command: cargo test -p topology-protocol-fm3 decodes_approved_fm3_identity_response -- --exact --nocapture
  expected_red:
    acceptable:
    - Missing decoder API.
    - Semantic assertion fails.
    unacceptable:
    - Fixture missing/checksum invalid.
    - Expected output derived from decoder.
    - Serial chunks confused with protocol bytes.
  green_command: cargo test -p topology-protocol-fm3 decodes_approved_fm3_identity_response -- --exact --nocapture
minimum_green:
- Implement only proven response form and required framing helpers.
- Bound lengths.
- No transport code.
required_sweeps:
- cargo test -p topology-protocol-fm3
- cargo fmt --all -- --check
- cargo clippy -p topology-protocol-fm3 --all-targets -- -D warnings
acceptance:
- Known fixture exact.
- Malformed cases safe.
- Reviewer approves provenance.
available_claims_after_completion:
