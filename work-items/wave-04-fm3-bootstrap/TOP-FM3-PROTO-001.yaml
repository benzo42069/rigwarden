title: Decode the approved FM3 identity response into typed identity
status: BLOCKED_FIXTURE
priority: high
requirement_ids:
- DEV-003
- QA-002
depends_on:
- TOP-FM3-FIX-001
- TOP-DOM-003
parallel_group: fm3-proto-a
agent:
  preferred_role: topology_implementer
  reviewer_role: topology_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - fixtures/fm3/identity/**
  - crates/topology_domain/**
  - docs/research/open-source-source-and-license-audit.md
  write:
  - crates/topology_protocol_fm3/Cargo.toml
  - crates/topology_protocol_fm3/src/lib.rs
