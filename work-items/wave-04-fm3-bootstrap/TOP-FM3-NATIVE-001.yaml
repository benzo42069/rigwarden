id: TOP-FM3-NATIVE-001
kind: implementation
epic: TOP-1100
title: Enumerate a matching FM3 USB serial endpoint on Android without opening it
status: BLOCKED_DEPENDENCY
priority: high
requirement_ids:
- TRANSPORT-002
- PLAT-002
depends_on:
- TOP-FM3-RSCH-001
- TOP-BOOT-003
parallel_group: fm3-native-a
agent:
  preferred_role: topology_implementer
  reviewer_role: topology_security_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - docs/research/fm3-transport-matrix.md
  - apps/mobile_flutter/android/**
  - docs/TRANSPORT_AND_COMPATIBILITY.md
  write:
  - apps/mobile_flutter/android/app/src/main/kotlin/**/Fm3UsbSerialEnumerator.kt
  - apps/mobile_flutter/android/app/src/test/**/Fm3UsbSerialEnumeratorTest.kt
  - apps/mobile_flutter/lib/core/native_transport/**
  - .tdd/evidence/TOP-FM3-NATIVE-001/**
  forbidden:
  - Cargo.toml
  - Cargo.lock
  - apps/mobile_flutter/pubspec.yaml
  - apps/mobile_flutter/ios/**
  - device-packs/**
behavior:
  why: Android direct-USB support begins with truthful endpoint discovery and no accidental opening of unrelated serial devices.
  given:
  - Android USB manager fake contains one evidenced FM3 descriptor and one unrelated serial device.
  when:
  - Enumerator lists matching endpoints.
  then:
  - FM3 endpoint is returned with stable safe metadata.
  - Unrelated device is excluded.
  - No permission request or endpoint open occurs.
  - Unknown descriptor is not guessed as FM3.
non_goals:
- Opening transport
- Sending bytes
- Physical device
- Generic serial library choice beyond required interface
preconditions:
- TOP-FM3-RSCH-001 integrated with exact matching evidence.
- Android unit-test harness available.
- Any dependency/shared manifest change integrated by parent.
test:
  layer: native_unit
  file: apps/mobile_flutter/android/app/src/test/**/Fm3UsbSerialEnumeratorTest.kt
  name: fm3_enumerator_matches_only_evidenced_descriptor
  red_command: cd apps/mobile_flutter/android && ./gradlew test --tests '*Fm3UsbSerialEnumeratorTest.fm3EnumeratorMatchesOnlyEvidencedDescriptor'
  expected_red:
    acceptable:
    - Missing enumerator API.
    - Assertion includes unrelated device or misses matching device.
    unacceptable:
    - Descriptor values guessed.
    - Android SDK/Gradle missing.
    - Test opens hardware instead of using bounded adapter.
  green_command: cd apps/mobile_flutter/android && ./gradlew test --tests '*Fm3UsbSerialEnumeratorTest.fm3EnumeratorMatchesOnlyEvidencedDescriptor'
minimum_green:
- Add narrow USB manager adapter and descriptor match from research data.
- No open/permission.
- Expose typed endpoint metadata to Flutter boundary only if needed.
required_sweeps:
- cd apps/mobile_flutter/android && ./gradlew test
- cd apps/mobile_flutter && flutter analyze
- cd apps/mobile_flutter && flutter test
acceptance:
- Only evidenced descriptor matches.
- No side effects.
- Reviewer/security reviewer approve.
available_claims_after_completion:
- UNIT_VERIFIED
unavailable_claims:
- PLATFORM_DEVICE_VERIFIED
- HARDWARE_VERIFIED
required_followups:
- TOP-FM3-NATIVE-002
- TOP-FM3-HIL-001
block_conditions: []
evidence_directory: .tdd/evidence/TOP-FM3-NATIVE-001
