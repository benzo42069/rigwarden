behavior:
  why: What exact FM3 control transports are evidenced on Android and iOS, including direct USB serial, MIDI interfaces, BLE adapters, and network bridge fallback?
  given:
  - The starter kit and current external documentation are available.
  when:
  - The assigned researcher investigates only the bounded question.
  then:
  - The deliverable distinguishes verified facts, hypotheses, unknowns, and blockers.
  - Every external factual claim has a source reference and access date.
  - No production behavior is created.
non_goals:
- Implementing transport
- Promising iOS direct serial
- Treating desktop behavior as mobile proof
preconditions:
- Repository contains this starter kit.
- Research access required by the packet is available or the packet is marked BLOCKED_ENVIRONMENT.
research:
  question: What exact FM3 control transports are evidenced on Android and iOS, including direct USB serial, MIDI interfaces, BLE adapters, and network bridge fallback?
  source_priority:
  - Official Fractal FM3 USB/connection documentation
  - Official Android USB host/serial APIs
  - Official Apple CoreMIDI/USB accessory constraints
  - Provenance-audited open-source FM3 transport implementations and hardware reports
  deliverables:
  - Confirm or reject Android direct USB serial with device identifiers/interface details treated as evidence-backed data.
  - Determine feasible iOS direct and interface-based paths without assuming arbitrary USB serial access.
  - List adapters and permissions required.
  - Define feature capability/throughput risks.
  - Produce exact native work packets/experiments and blockers.
  review:
  - Independent reviewer checks source quality, license interpretation boundaries, contradictions, and actionable conclusions.
acceptance:
- Confirm or reject Android direct USB serial with device identifiers/interface details treated as evidence-backed data.
- Determine feasible iOS direct and interface-based paths without assuming arbitrary USB serial access.
- List adapters and permissions required.
- Define feature capability/throughput risks.
- Produce exact native work packets/experiments and blockers.
- Uncertainty and contradictory sources are explicit.
- The report names follow-up ADRs or implementation packets without editing production code.
- Independent review is recorded.
block_conditions:
- Required source cannot be accessed.
- A material legal conclusion would require counsel rather than engineering inference.
evidence_directory: .tdd/evidence/TOP-FM3-RSCH-001
