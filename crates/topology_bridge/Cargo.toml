[package]
name = "topology-bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
topology-domain = { path = "../topology_domain" }
topology-routing = { path = "../topology_routing" }
topology-command-engine = { path = "../topology_command_engine" }
topology-device-registry = { path = "../topology_device_registry" }
topology-simulator = { path = "../topology_simulator" }
topology-undo = { path = "../topology_undo" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
