behavior:
  why: A delayed response from a disconnected session must never confirm a newer write.
  given:
  - Request 7 belongs to connection generation 1.
  - The session reconnects as generation 2 and issues request 7 again.
  - A generation-1 response arrives.
  when:
  - The command session processes the response.
  then:
  - The stale response is ignored/rejected.
  - Generation-2 request remains pending.
  - A matching generation-2 response can complete it.
non_goals:
- Physical reconnect
- Retry policy
- UI message
preconditions:
- TOP-SIM-001 integrated.
test:
  layer: rust_unit
  file: crates/topology_command_engine/tests/stale_response.rs
  name: stale_response_cannot_confirm_new_connection_request
  red_command: cargo test -p topology-command-engine stale_response_cannot_confirm_new_connection_request -- --exact --nocapture
  expected_red:
    acceptable:
    - Assertion fails because stale response completes request.
    - Missing connection-generation API.
    unacceptable:
    - Fixture uses distinct request IDs and never exercises generation.
    - Unrelated simulator mismatch.
  green_command: cargo test -p topology-command-engine stale_response_cannot_confirm_new_connection_request -- --exact --nocapture
minimum_green:
- Add connection generation to request/response correlation.
- Reject stale without mutating confirmed state.
- No retry implementation.
required_sweeps:
- cargo test -p topology-command-engine
- cargo test -p topology-simulator
- cargo fmt --all -- --check
- cargo clippy -p topology-command-engine --all-targets -- -D warnings
acceptance:
- Stale response rejected.
- Current response accepted.
- Security reviewer approves.
available_claims_after_completion:
