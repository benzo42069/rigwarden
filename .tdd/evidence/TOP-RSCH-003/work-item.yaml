id: TOP-RSCH-003
kind: research
epic: TOP-000
title: Build the official Fractal device, firmware, and protocol source map
status: READY
priority: high
requirement_ids:
- DEV-003
- PACK-002
- QA-002
depends_on: []
parallel_group: research-a
agent:
  preferred_role: topology_fixture_researcher
  reviewer_role: topology_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - README.md
  - AGENTS.md
  - docs/**
  - sources/RESEARCH_TARGETS.md
  - .codex/**
  - work-items/**
  write:
  - docs/research/fractal-primary-source-map.md
  - .tdd/evidence/TOP-RSCH-003/**
  forbidden:
  - apps/**
  - crates/**
  - native/**
  - device-packs/**
  - Cargo.toml
  - Cargo.lock
  - pubspec.yaml
behavior:
  why: Which official manuals, MIDI specifications, firmware notes, and product documents are authoritative for each modern and legacy target?
  given:
  - The starter kit and current external documentation are available.
  when:
  - The assigned researcher investigates only the bounded question.
  then:
  - The deliverable distinguishes verified facts, hypotheses, unknowns, and blockers.
  - Every external factual claim has a source reference and access date.
  - No production behavior is created.
non_goals:
- Assuming one device document applies to all
- Deriving undocumented write bytes
- Declaring full editor support
preconditions:
- Repository contains this starter kit.
- Research access required by the packet is available or the packet is marked BLOCKED_ENVIRONMENT.
research:
  question: Which official manuals, MIDI specifications, firmware notes, and product documents are authoritative for each modern and legacy target?
  source_priority:
  - Current official Fractal support pages
  - Current device manuals and release notes
  - Published third-party MIDI documents
  - Official connection/driver documentation
  deliverables:
  - Create per-device source inventory for AM4, VP4, Axe-Fx III, FM9, FM3, Axe-Fx II family, AX8, and FX8.
  - Record document version/date and covered firmware.
  - Separate documented control messages from undocumented full-editor behavior.
  - List identity/discovery, transport, preset/file, realtime, cab, and FC facts explicitly supported.
  - Identify gaps requiring lawful capture or open-source corroboration.
  review:
  - Independent reviewer checks source quality, license interpretation boundaries, contradictions, and actionable conclusions.
acceptance:
- Create per-device source inventory for AM4, VP4, Axe-Fx III, FM9, FM3, Axe-Fx II family, AX8, and FX8.
- Record document version/date and covered firmware.
- Separate documented control messages from undocumented full-editor behavior.
- List identity/discovery, transport, preset/file, realtime, cab, and FC facts explicitly supported.
- Identify gaps requiring lawful capture or open-source corroboration.
- Uncertainty and contradictory sources are explicit.
- The report names follow-up ADRs or implementation packets without editing production code.
- Independent review is recorded.
block_conditions:
- Required source cannot be accessed.
- A material legal conclusion would require counsel rather than engineering inference.
evidence_directory: .tdd/evidence/TOP-RSCH-003
