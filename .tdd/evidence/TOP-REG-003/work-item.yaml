id: TOP-REG-003
kind: implementation
epic: TOP-100
title: Expose one exact numeric parameter range from an in-memory device profile
status: READY
priority: high
requirement_ids:
- BLOCK-003
- PACK-002
depends_on:
- TOP-REG-001
parallel_group: core-registry-b
agent:
  preferred_role: topology_implementer
  reviewer_role: topology_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - crates/topology_device_registry/**
  - docs/ARCHITECTURE.md
  write:
  - crates/topology_device_registry/src/lib.rs
  - crates/topology_device_registry/src/resolve.rs
  - crates/topology_device_registry/tests/numeric_parameter_metadata.rs
  - .tdd/evidence/TOP-REG-003/**
  forbidden:
  - Cargo.toml
  - Cargo.lock
  - apps/**
  - native/**
  - device-packs/**
  - work-items/index.yaml
behavior:
  why: A command validator must read parameter bounds from the selected device profile rather than create a second Dart or command-local source of truth.
  given:
  - An exact writable in-memory profile for test-family/test-model firmware 1.0.
  - The profile declares block amp-1 parameter gain as exact tenths: inclusive stored range 0 through 100 with decimal_places 1, representing 0.0 through 10.0 without floating-point or NaN semantics.
  when:
  - The profile metadata is queried by block and parameter identifier.
  then:
  - The exact numeric definition, literal stored bounds, and decimal precision are returned.
  - A different parameter identifier has no definition.
  - No protocol mapping, bytes, range inference, or compatibility fallback is created.
non_goals:
- JSON/device-pack loading
- Parameter encoding or transport
- Enum, string, curve, unit, scene, or modifier metadata
- Firmware ranges or fallback
preconditions:
- TOP-REG-001 integrated.
test:
  layer: rust_unit
  file: crates/topology_device_registry/tests/numeric_parameter_metadata.rs
  name: exact_numeric_parameter_metadata_is_profile_owned
  red_command: cargo test -p topology-device-registry exact_numeric_parameter_metadata_is_profile_owned -- --exact --nocapture
  expected_red:
    acceptable:
    - Missing numeric parameter metadata/profile lookup API.
    - Assertion fails because the exact bounds are not retained by the profile.
    unacceptable:
    - Workspace membership missing.
    - Command-engine implementation substitutes profile metadata.
    - Unrelated registry or domain failure.
  green_command: cargo test -p topology-device-registry exact_numeric_parameter_metadata_is_profile_owned -- --exact --nocapture
minimum_green:
- Use an in-memory typed profile fixture only.
- Add one profile-owned numeric definition and exact lookup.
- Keep identifier, integer bounds, and decimal precision opaque/literal; do not infer ranges or introduce floating-point/NaN semantics.
required_sweeps:
- cargo test -p topology-device-registry
- cargo test -p topology-domain
- cargo fmt --all -- --check
- cargo clippy -p topology-device-registry --all-targets -- -D warnings
acceptance:
- Exact amp-1/gain tenths bounds and decimal precision are returned from the profile.
- Missing parameter returns no definition.
- No protocol or transport coupling.
- Reviewer approves.
available_claims_after_completion:
- UNIT_VERIFIED
unavailable_claims:
- PACK_SIGNATURE_VERIFIED
- BYTE_FIXTURE_VERIFIED
- HARDWARE_VERIFIED
required_followups:
- TOP-CMD-001
block_conditions: []
evidence_directory: .tdd/evidence/TOP-REG-003
