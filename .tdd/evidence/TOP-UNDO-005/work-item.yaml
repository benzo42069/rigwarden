id: TOP-UNDO-005
kind: implementation
epic: TOP-500
title: Reload one confirmed journal snapshot from a local file after restart simulation
status: READY
priority: high
requirement_ids:
- UNDO-002
depends_on:
- TOP-UNDO-004
parallel_group: core-undo-d
agent:
  preferred_role: topology_implementer
  reviewer_role: topology_security_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - crates/topology_undo/**
  - docs/decisions/ADR-0006-local-journal-snapshot-foundation.md
  write:
  - crates/topology_undo/src/persistence.rs
  - crates/topology_undo/src/lib.rs
  - crates/topology_undo/tests/local_snapshot.rs
  - .tdd/evidence/TOP-UNDO-005/**
  forbidden:
  - Cargo.toml
  - Cargo.lock
  - apps/**
  - native/**
  - device-packs/**
  - work-items/index.yaml
  - docs/requirements/traceability.yaml
behavior:
  why: A byte snapshot is not a persistent record until the application can write it locally and construct a fresh journal from that file.
  given:
  - One confirmed `amp-1/gain` entry from 3.0 to 4.5 and a caller-selected empty temporary directory.
  when:
  - The journal writes its snapshot to a local path, the original journal is dropped, and a fresh journal loads that path.
  then:
  - The exact active branch and completed entry are restored.
  - The adapter uses a sibling temporary path followed by replacement.
  - I/O and malformed snapshot errors are structured.
  - No pending mutation or restoration is silently persisted.
non_goals:
- Fsync/power-loss guarantee
- Cross-process locking
- SQLite, migration, compaction, encryption, or corruption repair
- Disconnect recovery, transport, simulator, Flutter, or hardware
preconditions:
- TOP-UNDO-004 is integrated.
- ADR-0006 is accepted.
test:
  layer: rust_unit
  file: crates/topology_undo/tests/local_snapshot.rs
  name: confirmed_entry_reloads_from_a_local_snapshot_after_restart_simulation
  red_command: cargo test -p topology-undo confirmed_entry_reloads_from_a_local_snapshot_after_restart_simulation -- --exact --nocapture
  expected_red:
    acceptable:
    - Missing local journal-store API.
    - Assertion fails because a fresh journal cannot restore the confirmed entry.
    unacceptable:
    - Temporary-directory setup failure.
    - Existing snapshot codec failure unrelated to the local adapter.
  green_command: cargo test -p topology-undo confirmed_entry_reloads_from_a_local_snapshot_after_restart_simulation -- --exact --nocapture
minimum_green:
- Add a narrow local snapshot adapter over the reviewed codec.
- Keep persistence caller-selected and local only.
- Do not claim durability past the test's write/drop/reload boundary.
required_sweeps:
- cargo test -p topology-undo
- cargo test -p topology-preset
- cargo fmt --all -- --check
- cargo clippy -p topology-undo --all-targets -- -D warnings
acceptance:
- Fresh journal reloads the exact confirmed entry from disk.
- In-flight work cannot be silently committed by the adapter.
- Independent security review approves.
available_claims_after_completion:
- UNIT_VERIFIED
unavailable_claims:
- BYTE_FIXTURE_VERIFIED
- SIMULATOR_VERIFIED
- PLATFORM_DEVICE_VERIFIED
- HARDWARE_VERIFIED
required_followups:
- TOP-E2E-000
block_conditions: []
evidence_directory: .tdd/evidence/TOP-UNDO-005
