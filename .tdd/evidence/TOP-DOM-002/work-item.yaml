id: TOP-DOM-002
kind: implementation
epic: TOP-100
title: Preserve a nonblank firmware identifier without semantic-version assumptions
status: READY
priority: high
requirement_ids:
- DEV-003
- DEV-005
depends_on:
- TOP-DOM-001
parallel_group: core-domain-a
agent:
  preferred_role: topology_implementer
  reviewer_role: topology_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - crates/topology_domain/**
  - docs/research/fractal-primary-source-map.md
  write:
  - crates/topology_domain/src/firmware.rs
  - crates/topology_domain/src/lib.rs
  - crates/topology_domain/tests/firmware_id.rs
  - .tdd/evidence/TOP-DOM-002/**
  forbidden:
  - Cargo.toml
  - Cargo.lock
  - apps/**
  - native/**
  - device-packs/**
  - work-items/index.yaml
  - docs/requirements/traceability.yaml
behavior:
  why: Firmware strings may not always obey generic SemVer; exact profile resolution needs a validated opaque identity first.
  given:
  - Inputs are whitespace-only and `1.02 beta 3`.
  when:
  - FirmwareId construction is attempted.
  then:
  - Whitespace-only input is rejected.
  - The nonblank firmware identifier is preserved exactly after only documented outer-whitespace handling.
  - No ordering/range behavior is implied.
non_goals:
- SemVer parsing
- Version ordering
- Compatible ranges
- Profile resolution
preconditions:
- TOP-DOM-001 integrated.
- Research has not established a universal firmware version grammar.
test:
  layer: rust_unit
  file: crates/topology_domain/tests/firmware_id.rs
  name: firmware_id_preserves_nonblank_vendor_text
  red_command: cargo test -p topology-domain firmware_id_preserves_nonblank_vendor_text -- --exact --nocapture
  expected_red:
    acceptable:
    - Missing FirmwareId API.
    - Assertion fails because text is normalized/destructively parsed.
    unacceptable:
    - Research file absent without parent resolving dependency.
    - Unrelated device ID failure.
  green_command: cargo test -p topology-domain firmware_id_preserves_nonblank_vendor_text -- --exact --nocapture
minimum_green:
- Add opaque validated FirmwareId newtype.
- Trim outer whitespace only if the test/contract chooses that behavior.
- Do not implement ordering.
required_sweeps:
- cargo test -p topology-domain
- cargo fmt --all -- --check
- cargo clippy -p topology-domain --all-targets -- -D warnings
acceptance:
- Nonblank vendor text preserved.
- Blank rejected.
- No accidental SemVer dependency.
- Reviewer approves.
available_claims_after_completion:
- UNIT_VERIFIED
unavailable_claims:
- FIRMWARE_RANGE_VERIFIED
- HARDWARE_VERIFIED
required_followups:
- TOP-DOM-003
- TOP-REG-001
block_conditions: []
evidence_directory: .tdd/evidence/TOP-DOM-002
