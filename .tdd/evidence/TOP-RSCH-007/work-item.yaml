behavior:
  why: What current deployment targets, target SDKs, permissions, privacy manifests, signing, testing, network, and open-source requirements constrain Topology’s release architecture?
  given:
  - The starter kit and current external documentation are available.
  when:
  - The assigned researcher investigates only the bounded question.
  then:
  - The deliverable distinguishes verified facts, hypotheses, unknowns, and blockers.
  - Every external factual claim has a source reference and access date.
  - No production behavior is created.
non_goals:
- Submitting store builds
- Handling credentials
- Inventing policy exceptions
preconditions:
- Repository contains this starter kit.
- Research access required by the packet is available or the packet is marked BLOCKED_ENVIRONMENT.
research:
  question: What current deployment targets, target SDKs, permissions, privacy manifests, signing, testing, network, and open-source requirements constrain Topology’s release architecture?
  source_priority:
  - Official Apple developer and App Store documentation
  - Official Android/Google Play documentation
  - Official F-Droid inclusion/build documentation
  - GitHub release/signing documentation
  deliverables:
  - Recommend exact minimum OS/deployment targets with rationale.
  - List required app permissions/entitlements and prohibited assumptions.
  - Define F-Droid flavor constraints.
  - Define signing/credential tasks requiring the account owner.
  - Identify privacy/data-safety disclosures for optional telemetry, AI, BLE, USB, files, and network bridge.
  - Create release-research blockers and ADR inputs.
  review:
  - Independent reviewer checks source quality, license interpretation boundaries, contradictions, and actionable conclusions.
acceptance:
- Recommend exact minimum OS/deployment targets with rationale.
- List required app permissions/entitlements and prohibited assumptions.
- Define F-Droid flavor constraints.
- Define signing/credential tasks requiring the account owner.
- Identify privacy/data-safety disclosures for optional telemetry, AI, BLE, USB, files, and network bridge.
- Create release-research blockers and ADR inputs.
- Uncertainty and contradictory sources are explicit.
- The report names follow-up ADRs or implementation packets without editing production code.
- Independent review is recorded.
block_conditions:
- Required source cannot be accessed.
- A material legal conclusion would require counsel rather than engineering inference.
evidence_directory: .tdd/evidence/TOP-RSCH-007
