id: TOP-RSCH-007
kind: research
epic: TOP-000
title: Map current Apple, Google Play, GitHub, and F-Droid distribution constraints
status: READY
priority: high
requirement_ids:
- PLAT-004
- PLAT-005
- PLAT-006
- PLAT-007
- PLAT-008
- PLAT-009
depends_on: []
