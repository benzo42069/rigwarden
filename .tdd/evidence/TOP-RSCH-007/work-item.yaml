agent:
  preferred_role: topology_explorer
  reviewer_role: topology_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - README.md
  - AGENTS.md
  - docs/**
  - sources/RESEARCH_TARGETS.md
  - .codex/**
  - work-items/**
  write:
  - docs/research/distribution-constraints.md
  - .tdd/evidence/TOP-RSCH-007/**
  forbidden:
  - apps/**
  - crates/**
  - native/**
