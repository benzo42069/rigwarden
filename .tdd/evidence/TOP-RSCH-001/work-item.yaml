behavior:
  why: Can this exact Codex installation run a Terra/High parent with project-scoped Luna/Max custom subagents, and what build/toolchain is available for Topology?
  given:
  - The starter kit and current external documentation are available.
  when:
  - The assigned researcher investigates only the bounded question.
  then:
  - The deliverable distinguishes verified facts, hypotheses, unknowns, and blockers.
  - Every external factual claim has a source reference and access date.
  - No production behavior is created.
non_goals:
- Implementing project code
- Relying on child self-identification as model proof
- Changing global Codex configuration without explicit need
preconditions:
- Repository contains this starter kit.
- Research access required by the packet is available or the packet is marked BLOCKED_ENVIRONMENT.
research:
  question: Can this exact Codex installation run a Terra/High parent with project-scoped Luna/Max custom subagents, and what build/toolchain is available for Topology?
  source_priority:
  - Current official Codex subagent/model documentation
  - Local .codex configuration and agent files
  - Runtime-visible thread metadata/logs/UI
  - Installed Rust, Flutter, Xcode, Android SDK, JDK, Git, and platform tools
  deliverables:
  - Record Codex version/build and multi-agent interface.
  - Run one read-only custom-agent probe and record requested versus effective model/effort using runtime evidence.
  - Record permission/sandbox behavior inherited by children.
  - Inventory Rust/Flutter/Dart/Xcode/Android/JDK/Git versions and missing tools.
  - Recommend a safe initial concurrency cap and identify routing/toolchain blockers.
  review:
  - Independent reviewer checks source quality, license interpretation boundaries, contradictions, and actionable conclusions.
acceptance:
- Record Codex version/build and multi-agent interface.
- Run one read-only custom-agent probe and record requested versus effective model/effort using runtime evidence.
- Record permission/sandbox behavior inherited by children.
- Inventory Rust/Flutter/Dart/Xcode/Android/JDK/Git versions and missing tools.
- Recommend a safe initial concurrency cap and identify routing/toolchain blockers.
- Uncertainty and contradictory sources are explicit.
- The report names follow-up ADRs or implementation packets without editing production code.
- Independent review is recorded.
block_conditions:
- Required source cannot be accessed.
- A material legal conclusion would require counsel rather than engineering inference.
evidence_directory: .tdd/evidence/TOP-RSCH-001
