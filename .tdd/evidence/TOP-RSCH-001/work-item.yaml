id: TOP-RSCH-001
kind: research
epic: TOP-000
title: Verify Codex runtime, toolchain, and effective Luna subagent routing
status: READY
priority: critical
requirement_ids:
- QA-001
depends_on: []
parallel_group: research-a
agent:
  preferred_role: topology_explorer
  reviewer_role: topology_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - README.md
  - AGENTS.md
  - docs/**
  - sources/RESEARCH_TARGETS.md
  - .codex/**
  - work-items/**
  write:
  - docs/research/codex-runtime-routing.md
  - .tdd/evidence/TOP-RSCH-001/**
  forbidden:
  - apps/**
  - crates/**
  - native/**
  - device-packs/**
