behavior:
  why: The first vertical slice must prove that the layers compose rather than existing as disconnected unit-test islands.
  given:
  - Exact writable synthetic profile has Amp 1 gain confirmed at 3.0.
  - Scripted simulator accepts 4.5 and returns confirmation.
  - Typed app harness exposes edit and undo actions.
  when:
  - User enters 4.5, confirms the edit, then invokes undo.
  then:
  - Mutation validates.
  - Deterministic command reaches simulator.
  - UI reports pending then confirmed 4.5.
  - Journal stores prior 3.0.
  - Undo sends restoration.
  - Simulator and UI finish confirmed at 3.0.
  - Transcript contains no vendor protocol claim.
non_goals:
- Physical device
- Native USB/MIDI
- Real protocol bytes
- Production artwork
- Crash persistence
preconditions:
- All dependencies integrated.
- TOP-E2E-000 supplies the reviewed Rust-owned composition API.
- ADR-0005 permits only the typed semantic command/event boundary used here.
test:
  layer: flutter_ffi_widget
  file: apps/mobile_flutter/test/core/bridge/simulated_parameter_edit_test.dart
  name: simulated_edit_confirmation_and_undo_complete_end_to_end
  red_command: cd apps/mobile_flutter && flutter test test/core/bridge/simulated_parameter_edit_test.dart --plain-name "simulated edit confirmation and undo complete end to end"
  expected_red:
    acceptable:
    - Missing composed application API.
    - Assertion fails at one boundary/state transition.
    unacceptable:
    - Test bypasses Rust command engine or simulator.
    - Test calls components directly without app path.
    - Native environment failure unrelated to deterministic harness.
  green_command: cd apps/mobile_flutter && flutter test test/core/bridge/simulated_parameter_edit_test.dart --plain-name "simulated edit confirmation and undo complete end to end"
minimum_green:
- Expose only typed semantic session actions and state through generated FRB.
- Use a test-owned Flutter harness with explicit edit/undo semantic controls.
- Do not add real protocol/native transport.
- Do not expose bytes, endpoint handles, or arbitrary send.
required_sweeps:
- cargo test --workspace
- cd apps/mobile_flutter && flutter test
- bash scripts/ci-local.sh
acceptance:
- Complete pending→confirmed→undo flow.
- Journal prior state exact.
- All layers actually crossed.
- Simulator label explicit.
- Independent correctness and accessibility reviews approve.
available_claims_after_completion:
