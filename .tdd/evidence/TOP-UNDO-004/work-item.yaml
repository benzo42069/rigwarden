id: TOP-UNDO-004
kind: implementation
epic: TOP-500
title: Serialize one confirmed branch history as a bounded deterministic journal snapshot
status: INTEGRATED
priority: high
requirement_ids:
- UNDO-002
depends_on:
- TOP-UNDO-003
parallel_group: core-undo-c
agent:
  preferred_role: topology_implementer
  reviewer_role: topology_security_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - crates/topology_undo/**
  - docs/decisions/ADR-0006-local-journal-snapshot-foundation.md
  write:
  - crates/topology_undo/src/journal.rs
  - crates/topology_undo/src/lib.rs
  - crates/topology_undo/tests/persistence.rs
  - .tdd/evidence/TOP-UNDO-004/**
  forbidden:
  - Cargo.toml
  - Cargo.lock
  - apps/**
  - native/**
  - device-packs/**
  - work-items/index.yaml
  - docs/requirements/traceability.yaml
behavior:
  why: A confirmed journal entry must survive a deterministic save/reload boundary before the composed edit path can truthfully include a persistent undo record.
  given:
  - Preset branch `preset-a` has one confirmed `amp-1/gain` entry from 3.0 to 4.5 and no pending mutation or restoration.
  when:
  - Its journal snapshot is encoded, the original journal is dropped, and a fresh journal decodes the snapshot.
  then:
  - The active branch, target, and exact prior/new IEEE-754 values are restored.
  - Re-encoding produces the same bytes.
  - Truncated or invalid-schema data is rejected without panic.
  - A journal with an in-flight mutation or restoration refuses to snapshot.
non_goals:
- Filesystem I/O or power-loss durability
- SQLite or library storage selection
- Crash/disconnect recovery
- Redo, migration, compaction, encryption, or corruption repair
- Protocol bytes, simulator, Flutter, or hardware
preconditions:
- TOP-UNDO-003 is integrated.
- ADR-0006 is accepted.
test:
  layer: rust_unit
  file: crates/topology_undo/tests/persistence.rs
  name: confirmed_entry_survives_deterministic_save_reload
  red_command: cargo test -p topology-undo confirmed_entry_survives_deterministic_save_reload -- --exact --nocapture
  expected_red:
    acceptable:
    - Missing typed snapshot encode/decode API.
    - Assertion fails because confirmed state is missing, altered, nondeterministic, or malformed input is accepted.
    unacceptable:
    - Existing journal behavior is broken.
    - Filesystem, network, process, or unrelated package failure.
  green_command: cargo test -p topology-undo confirmed_entry_survives_deterministic_save_reload -- --exact --nocapture
minimum_green:
- Add an internal versioned bounded snapshot codec and structured persistence error.
- Preserve confirmed branch history only; reject transient work explicitly.
- Use literal independent magic/schema bytes in test and bounded malformed inputs.
required_sweeps:
- cargo test -p topology-undo
- cargo test -p topology-preset
- cargo fmt --all -- --check
- cargo clippy -p topology-undo --all-targets -- -D warnings
acceptance:
- Confirmed entry and active branch reload exactly.
- Snapshot is deterministic.
- Invalid/truncated data and transient state fail closed without panic.
- Independent security review approves.
available_claims_after_completion:
- UNIT_VERIFIED
unavailable_claims:
