behavior:
  why: Stable validated identifiers are required before profiles, presets, or commands can refer to devices safely.
  given:
  - Input strings are empty, whitespace-only, or a valid lowercase-hyphen identifier such as `fractal-gen3`.
  when:
  - DeviceFamilyId construction is attempted.
  then:
  - Blank/whitespace values return a structured error.
  - The valid identifier is preserved exactly.
  - No panic occurs.
non_goals:
- Case-folding policy beyond the tested input
- Vendor registry
- Device model or firmware
preconditions:
- Rust harness integrated.
test:
  layer: rust_unit
  file: crates/topology_domain/tests/device_family_id.rs
  name: blank_device_family_id_is_rejected
  red_command: cargo test -p topology-domain blank_device_family_id_is_rejected -- --exact --nocapture
  expected_red:
    acceptable:
    - Missing DeviceFamilyId API with unrelated crate compiling.
    - Assertion fails because blank input is accepted.
    unacceptable:
    - Unrelated harness failure.
    - Test fails only because module export was forgotten after implementation.
    - Dependency/network failure.
  green_command: cargo test -p topology-domain blank_device_family_id_is_rejected -- --exact --nocapture
minimum_green:
- Add one validated newtype and structured error.
- Avoid regex/dependency unless the behavior requires it.
- Do not add model/firmware types.
required_sweeps:
- cargo test -p topology-domain
- cargo fmt --all -- --check
- cargo clippy -p topology-domain --all-targets -- -D warnings
acceptance:
- Blank rejected.
- Valid ID accepted/preserved.
- Error is comparable or machine-readable.
- Reviewer approves.
