id: TOP-REG-001
kind: implementation
epic: TOP-100
title: Resolve an exact device and firmware profile as writable
status: READY
priority: high
requirement_ids:
- DEV-004
- PACK-006
depends_on:
- TOP-DOM-003
parallel_group: core-registry-a
agent:
  preferred_role: topology_implementer
  reviewer_role: topology_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - crates/topology_domain/**
  - schemas/device-pack.schema.json
  - docs/ARCHITECTURE.md
  write:
  - crates/topology_device_registry/Cargo.toml
  - crates/topology_device_registry/src/lib.rs
  - crates/topology_device_registry/src/resolve.rs
  - crates/topology_device_registry/tests/exact_resolution.rs
  - .tdd/evidence/TOP-REG-001/**
  forbidden:
  - Cargo.toml
  - Cargo.lock
  - apps/**
  - native/**
  - device-packs/**
  - work-items/index.yaml
behavior:
  why: Write capability must come from an exact verified profile match, not from device identity alone.
  given:
  - A registry contains one test profile matching family `test-family`, model `test-model`, and firmware `1.0`.
  - The profile declares write capability.
  when:
  - The matching DeviceIdentity is resolved.
  then:
  - Resolution returns that exact profile.
  - The session capability includes write.
  - The result records exact-match provenance/status.
non_goals:
- Loading JSON packs
- Signature verification
- Compatible ranges
- Unknown firmware
preconditions:
- TOP-DOM-003 integrated.
- Integration owner permits creation of the new crate through wildcard workspace or an amendment.
test:
  layer: rust_unit
  file: crates/topology_device_registry/tests/exact_resolution.rs
  name: exact_profile_match_can_enable_write
  red_command: cargo test -p topology-device-registry exact_profile_match_can_enable_write -- --exact --nocapture
  expected_red:
    acceptable:
    - Missing registry/resolver API.
    - Assertion fails because exact profile cannot resolve.
    unacceptable:
    - Workspace membership missing.
    - External dependency unavailable.
    - Unrelated domain failure.
  green_command: cargo test -p topology-device-registry exact_profile_match_can_enable_write -- --exact --nocapture
minimum_green:
- Use in-memory typed test profiles.
- Implement exact equality only.
- Write capability must be explicit in profile.
- Do not implement fallback.
required_sweeps:
- cargo test -p topology-device-registry
- cargo test -p topology-domain
- cargo fmt --all -- --check
- cargo clippy -p topology-device-registry --all-targets -- -D warnings
acceptance:
- Exact match resolves.
- Nonmatching model does not resolve as exact.
- Write comes only from profile.
- Reviewer approves.
available_claims_after_completion:
- UNIT_VERIFIED
unavailable_claims:
- PACK_SIGNATURE_VERIFIED
- HARDWARE_VERIFIED
required_followups:
- TOP-REG-002
- TOP-CMD-001
block_conditions: []
evidence_directory: .tdd/evidence/TOP-REG-001
amendments:
- recorded_at: 2026-08-09T14:00:00-05:00
  author: parent_orchestrator
  reason: TOP-DOM-003 is integrated. The parent created a product-empty workspace harness and path dependency so the packet's focused RED can fail on the intended missing registry API rather than workspace membership.
  changes:
  - status advanced from BLOCKED_DEPENDENCY to READY.
  - integration owner added the root workspace member, lockfile entry, and empty crate harness outside worker scope.
  claim_changed: false
