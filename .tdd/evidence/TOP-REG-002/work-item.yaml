id: TOP-REG-002
kind: implementation
epic: TOP-100
title: Unknown firmware resolves to a non-writable session
status: READY
priority: high
requirement_ids:
- DEV-005
- PACK-006
- SEC-001
depends_on:
- TOP-REG-001
parallel_group: core-registry-a
agent:
  preferred_role: topology_implementer
  reviewer_role: topology_reviewer
  integrator_role: parent_orchestrator
scope:
  read:
  - crates/topology_device_registry/**
  - crates/topology_domain/**
  write:
  - crates/topology_device_registry/src/resolve.rs
  - crates/topology_device_registry/tests/unknown_firmware.rs
  - .tdd/evidence/TOP-REG-002/**
  forbidden:
  - Cargo.toml
  - Cargo.lock
